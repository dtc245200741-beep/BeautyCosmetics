services:
  mysql:
    image: mysql:8.0
    container_name: de3-products-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - de3_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - de3_backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.2-apache
    container_name: de3-products-wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
            $$_SERVER['SERVER_PORT'] = 443;
        }

    volumes:
      - de3_wordpress_data:/var/www/html
    networks:
      - de3_backend
      - de3_frontend
    depends_on:
      mysql:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: de3-products-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - de3_backend
      - de3_frontend
    depends_on:
      mysql:
        condition: service_healthy
  nginx:
    image: nginx:1.28-alpine
    container_name: de3-products-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - de3_frontend
      - de3_monitoring
    depends_on:
      - wordpress
      - phpmyadmin

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: de3-products-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - de3_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - de3_monitoring
      - de3_backend
    depends_on:
      - node-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:12.1.0
    container_name: de3-products-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - de3_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - de3_monitoring
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.5.3
    container_name: de3-products-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - de3_loki_data:/loki
    networks:
      - de3_monitoring

  promtail:
    image: grafana/promtail:3.5.3
    container_name: de3-products-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - de3_promtail_positions:/tmp
    networks:
      - de3_monitoring
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: de3-products-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    networks:
      - de3_monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: de3-products-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - de3_monitoring

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: de3-products-alertmanager
    restart: unless-stopped
    ports:
      - "9094:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - de3_monitoring

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: de3-products-mysql-exporter
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=exporter"
    networks:
      - de3_backend
      - de3_monitoring
    depends_on:
      mysql:
        condition: service_healthy

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: de3-products-blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    networks:
      - de3_monitoring
      - de3_frontend

networks:
  de3_backend:
    name: de3_products_backend
  de3_frontend:
    name: de3_products_frontend
  de3_monitoring:
    name: de3_products_monitoring
volumes:
  de3_mysql_data:
    name: de3_products_mysql_data
  de3_wordpress_data:
    name: de3_products_wordpress_data
  de3_prometheus_data:
    name: de3_products_prometheus_data
  de3_grafana_data:
    name: de3_products_grafana_data
  de3_loki_data:
    name: de3_products_loki_data
  de3_promtail_positions:
    name: de3_products_promtail_positions
